name: mock-and-privacy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: make setup test smoke scan
      - run: cd apps/web && npx playwright install --with-deps chromium && npm run e2e
      - run: cd apps/web && npm audit --json > ../../evidence/npm-audit.json
      - run: pipx run pip-audit -r requirements.lock --format json --output evidence/python-audit.json
      - run: make evidence
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-acceptance-evidence
          path: evidence/
